<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="clay">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <meta name="description" content="Tabnest · 自托管的个人书签面板">
  <title>Tabnest · 个人书签面板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/theme-init-20261031i.js"></script>
  <link rel="stylesheet" href="/style-20261031i.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="面板导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="currentColor" opacity=".16"/>
            <rect x="13" y="19" width="16" height="26" rx="5" fill="currentColor"/>
            <rect x="34" y="14" width="16" height="34" rx="5" fill="currentColor" opacity=".55"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Tabnest</strong>
          <small>个人书签面板</small>
        </span>
        <button class="icon-btn sidebar-close only-mobile" data-act="toggle-sidebar" aria-label="关闭导航">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="sidebar-section">
        <span class="section-label">面板</span>
        <button class="rail-add" id="btn-new-board" type="button" title="新建面板" aria-label="新建面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <nav class="board-list" id="board-list" aria-label="面板列表"></nav>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <div class="topbar">
        <label class="search topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
          <input id="search-input" type="search" placeholder="搜索" autocomplete="off" spellcheck="false" aria-label="搜索书签">
          <kbd>/</kbd>
        </label>
        <div class="topbar-actions">
          <button class="topbar-btn" id="btn-import" type="button" title="导入 / 导出书签" aria-label="导入或导出书签">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          </button>
          <button class="topbar-btn" id="btn-theme" type="button" title="外观与配色" aria-label="外观与配色">
            <span class="theme-dot" aria-hidden="true"></span>
          </button>
          <button class="topbar-btn hidden" id="btn-logout" type="button" title="退出登录" aria-label="退出登录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg>
          </button>
          <span class="version" id="app-version">v0.1.0</span>
        </div>
      </div>
      <header class="main-head" id="main-head"></header>
      <div class="board-view" id="board-view"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-layer" id="modal-layer" hidden></div>

  <div class="login-layer" id="login-layer" hidden>
    <form class="login-card" id="login-form">
      <span class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="currentColor" opacity=".16"/>
          <rect x="13" y="19" width="16" height="26" rx="5" fill="currentColor"/>
          <rect x="34" y="14" width="16" height="34" rx="5" fill="currentColor" opacity=".55"/>
        </svg>
      </span>
      <h1>Tabnest</h1>
      <p>输入访问密码，打开你的书签面板。</p>
      <p class="form-hint" id="login-hint" hidden></p>
      <label class="field">
        <span>密码</span>
        <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn primary block" type="submit" id="login-submit">进入</button>
    </form>
  </div>

  <div class="boot" id="boot">
    <span class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="currentColor" opacity=".16"/>
        <rect x="13" y="19" width="16" height="26" rx="5" fill="currentColor"/>
        <rect x="34" y="14" width="16" height="34" rx="5" fill="currentColor" opacity=".55"/>
      </svg>
    </span>
    <span>正在打开 Tabnest…</span>
  </div>

  <noscript>
    <p class="noscript">Tabnest 需要启用 JavaScript 才能使用。</p>
  </noscript>

  <script src="/app-20261031i.js" defer></script>
</body>
</html>
