[package]
name = "tabnest-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Runtime-agnostic helpers shared by the Tabnest server and the Cloudflare Workers build"
license = "MIT"

[dependencies]
anyhow = "1.0"
hmac = "0.12"
hex = "0.4"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
