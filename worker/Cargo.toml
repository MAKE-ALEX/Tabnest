[package]
name = "tabnest-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Tabnest on Cloudflare Workers (D1 + Static Assets)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tabnest-core = { path = "../crates/core" }
tower = { version = "0.5", features = ["util"] }
url = "2"
worker = { version = "0.8", features = ["http", "axum", "d1"] }
